introduction: |
  Welcome to the **YOLO Pro Blueprint App** for Particle! 

  This tutorial walks you through setting up and running real-time object detection using **YOLO Pro** on your Linux device.

description: |
  The **YOLO Pro Blueprint** runs real-time vehicle detection on your **Tachyon** using **Edge Impulse's YOLO-Pro** model (early beta).
  Inference runs entirely on the device: one container serves the model, and a Python app streams frames from a USB webcam to it and draws the detected vehicles on screen.

  Each vehicle is tracked across frames, so it's counted once. When a new one appears, the app publishes a `new_car` event with a snapshot to the Particle Cloud, ready to forward to your own integrations.
  Included models are trained for freeway traffic and garage monitoring.

